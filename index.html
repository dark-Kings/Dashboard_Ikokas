<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- <style>
        * {
            outline: 1px solid red;
        }
    </style> -->
</head>

<body class="bg-[#f5f5f5] max-w-[2450px] mx-auto">
    <div class="flex flex-col md:flex-row w-full">

        <!-- Sidebar (Desktop + Mobile Drawer) -->
        <aside id="sidebar" class="fixed md:static top-0 left-0 z-50 md:z-auto
                       w-64 h-screen bg-[#f5f5f5]
                       flex flex-col justify-between
                       p-4 md:pl-[20px] md:pt-[44px] md:pr-0 md:pb-0
                       mt-0 md:mt-5 md:mb-5
                       rounded-tr-xl rounded-br-xl md:rounded-none
                       overflow-y-auto
                       -translate-x-full md:translate-x-0
                       transition-transform duration-300 ease-in-out md:transition-none">

            <div class="flex flex-col flex-1">
                <div class="flex items-center gap-2 mb-10 pb-3 relative pl-[5px] md:pl-3">
                    <img src="assets/logo.png" alt="logo" class="w-[22px] h-[22px] object-contain ">
                    <span class="font-semibold text-sm">PURITY UI DASHBOARD</span>
                    <div class="absolute bottom-[-10px] left-0 w-full h-[2px] 
                bg-gradient-to-r 
                from-transparent 
                via-[#E0E1E2] 
                to-transparent">
                    </div>
                </div>

                <div class="flex flex-col flex-1 justify-start space-y-2" id="menu"></div>
            </div>

            <div class="flex items-center justify-between pt-4 border-t md:hidden">
                <div class="flex items-center gap-2">
                    <div class="icon-box w-8 h-8 flex items-center justify-center bg-white rounded-lg">
                        <img src="assets/signin.png" class="w-4 h-4">
                    </div>
                    <span>Sign In</span>
                </div>

                <div class="flex items-center gap-4">
                    <img src="assets/setting.png" alt="settings" class="w-5 h-5 object-contain">
                    <img src="assets/notification.png" alt="notifications" class="w-5 h-5 object-contain">
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex flex-col flex-1 overflow-y-auto mt-[6px] ">

            <!-- Header (Mobile + Desktop) -->
            <header
                class="flex items-start md:items-center justify-between p-5 md:p-4 border-b md:border-b-0 md:mt-[26px] md:mb-[29px] md:ml-[64px] md:mr-[30px] mb-[30px] md:pl-0">
                <div class="flex items-center gap-3 md:items-start">
                    <div class="flex flex-col">
                        <div class="md:hidden flex items-center gap-2">
                            <div class="w-8 h-8 flex items-center justify-center bg-white rounded-lg">
                                <svg class="w-4 h-4 text-[#4FD1C5]" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-6v-6H10v6H4a1 1 0 0 1-1-1v-9.5Z"
                                        stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                                </svg>
                            </div>
                            <span class="font-semibold text-sm uppercase" data-page-label="mobile">DASHBOARD</span>
                        </div>

                        <div class="hidden md:block">
                            <div class="text-[12px] font-normal text-gray-700">
                                <span class="text-gray-400 font-normal">Pages</span> /
                                <span data-page-label="breadcrumb">Dashboard</span>
                            </div>
                            <div class="font-bold text-gray-700 mt-[5px]" data-page-label="heading">Dashboard</div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end">
                    <button onclick="openMenu()"
                        class="md:hidden text-2xl active:scale-95 transition leading-none pt-[2px]">
                        ☰
                    </button>

                    <div class="hidden md:flex items-center justify-between ">
                        <div class="flex items-center gap-2">
                            <img src="assets/signin.png" class="w-4 h-4" alt="sign in">
                            <span class="text-sm font-bold text-gray-500">Sign In</span>
                        </div>

                        <div class="flex items-center gap-3 ml-4">
                            <img src="assets/setting.png" alt="settings" class="w-4 h-4 object-contain">
                            <img src="assets/notification.png" alt="notifications" class="w-4 h-4 object-contain">
                        </div>
                    </div>
                </div>
            </header>



            <!-- Overlay -->
            <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 md:hidden" onclick="closeMenu()">
            </div>


            <!-- Dashboard -->
            <div class=" flex flex-col ">
                <!-- section 1 -->
                <div id="section1Cards"
                    class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-6 w-auto ml-[2px] md:ml-[28px] mr-[2px] p-5 pt-0 pb-0 mb-[24px]">
                </div>
                <!-- section 2 -->
                <div id="section2"
                    class="grid grid-cols-1 lg:grid-cols-5 gap-6 ml-[2px] md:ml-[28px] mr-[2px] p-5 pt-0 items-stretch pb-0 mb-[24px]">
                </div>
                <!-- section3 -->
                <div id="section3"
                    class="grid grid-cols-1 xl:grid-cols-3 gap-[25px] ml-[2px] md:ml-[28px] mr-[2px] items-stretch mb-5 p-5 pt-0">
                </div>
            </div>

        </div>
    </div>

    <!-- Js-->
    <script>
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        function isMobile() {
            return window.matchMedia("(max-width: 767px)").matches;
        }

        function openMenu() {
            if (!isMobile()) return;
            sidebar.classList.remove("-translate-x-full");
            overlay.classList.remove("hidden");
        }

        function closeMenu() {
            if (!isMobile()) return;
            sidebar.classList.add("-translate-x-full");
            overlay.classList.add("hidden");
        }

        const menu = document.getElementById("menu");
        const pageLabelNodes = document.querySelectorAll("[data-page-label]");

        const MENU_ITEMS = [
            {
                id: "dashboard",
                label: "Dashboard",
                svg: `
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-6v-6H10v6H4a1 1 0 0 1-1-1v-9.5Z"
                            stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                    </svg>
                `,
            },
            {
                id: "tables",
                label: "Tables",
                svg: `
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 6h16M4 10h16M4 14h16M4 18h16" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                        <path d="M8 6v12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                `,
            },
            {
                id: "billing",
                label: "Billing",
                svg: `
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                            d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"
                            stroke="currentColor" stroke-width="2" />
                        <path d="M7 9h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <path d="M7 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                `,
            },
            {
                id: "rtl",
                label: "RTL",
                svg: `
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M11 8H5v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M7 10 4 13l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M20 8h-6v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                `,
            },
            {
                id: "profile",
                label: "Profile",
                svg: `
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 21a8 8 0 1 0-16 0" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                `,
            },
        ];

        const SECTION1_CARDS = [
            {
                title: "Today's Money",
                value: "$53,000",
                delta: "+55%",
                iconSvg: `
                    <svg class="w-[20px] h-[20px] text-white" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                            d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"
                            stroke="currentColor" stroke-width="2" />
                        <path d="M16 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                `,
            },
            {
                title: "Today's Users",
                value: "2,300",
                delta: "+5%",
                iconSvg: `
                    <svg class="w-[20px] h-[20px] text-white" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M16 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 0a6 6 0 1 1 4.472-10.03"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M12 10a4 4 0 1 0-8 0" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                `,
            },
            {
                title: "New Clients",
                value: "+3,052",
                delta: "-14%",
                iconSvg: `
                    <svg class="w-[20px] h-[20px] text-white" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M19 8v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <path d="M22 11h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                `,
            },
            {
                title: "Total Sales",
                value: "$173,000",
                delta: "+8%",
                iconSvg: `
                    <svg class="w-[20px] h-[20px] text-white" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M6 7h15l-1.5 8.5a2 2 0 0 1-2 1.5H9a2 2 0 0 1-2-1.5L5 3H2"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor" />
                        <path d="M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor" />
                    </svg>
                `,
            },
        ];

        const SECTION2_ITEMS = [
            {
                type: "splitCard",
                colSpanClass: "lg:col-span-3",
                kicker: "Built by developers",
                title: "Purity UI Dashboard",
                body: `From colors, cards, typography to complex elements,
                                    you will find the full documentation.`,
                ctaLabel: "Read more",
                imageSrc: "assets/chakraimg.png",
                imageAlt: "Dashboard preview",
            },
            {
                type: "overlayCard",
                colSpanClass: "lg:col-span-2",
                title: "Work with the Rockets",
                body: `Wealth creation is an evolutionarily recent positive-sum game.
                                        It is all about who take the opportunity first.`,
                ctaLabel: "Read more",
                backgroundImage: "assets/bookyimg.png",
            },
        ];

        const SECTION3_ITEMS = [
            {
                type: "projectTable",
                colSpanClass: "xl:col-span-2",
                header: {
                    title: "Projects",
                    subtitle: "30 done this month",
                    icon: "assets/circle.png",
                    menuIcon: "assets/trepaldot.png"
                },
                table: {
                    headers: ["Companies", "Members", "Budget", "Completion"],
                    rows: [
                        {
                            name: "Chakra Soft UI Version",
                            icon: "assets/Icon.png",
                            members: [
                                "assets/Avatar 5.png",
                                "assets/Avatar 4.png",
                                "assets/Avatar 4.png"
                            ],
                            budget: "$14,000",
                            completion: 60
                        },
                        {
                            name: "Add Progress Track",
                            icon: "assets/Icon.png",
                            members: ["assets/Avatar 5.png", "assets/Avatar 4.png"],
                            budget: "$3,000",
                            completion: 10
                        },
                        {
                            name: "Fix Platform Errors",
                            icon: "assets/Icon.png",
                            members: ["assets/Avatar 5.png", "assets/Avatar 4.png"],
                            budget: "Not Set",
                            completion: 100
                        },
                        {
                            name: "Launch our Mobile App",
                            icon: "assets/Icon.png",
                            members: ["assets/Avatar 5.png", "assets/Avatar 4.png", "assets/Avatar 5.png", "assets/Avatar 4.png"],
                            budget: "$32,000",
                            completion: 100
                        },
                        {
                            name: "Add the New Pricing Page",
                            icon: "assets/Icon.png",
                            members: ["assets/Avatar 5.png", "assets/Avatar 4.png", "assets/Avatar 5.png", "assets/Avatar 4.png", "assets/Avatar 5.png"],
                            budget: "$32,000",
                            completion: 25
                        },
                        {
                            name: "Redesign New Online Shop",
                            icon: "assets/Icon.png",
                            members: ["assets/Avatar 5.png", "assets/Avatar 4.png"],
                            budget: "$7,600",
                            completion: 40
                        }
                    ]
                }
            },
            {
                type: "imageCard",
                colSpanClass: "xl:col-span-1",
                image: "assets/chakraimg.png"
            }
        ];

        function getInitialActiveMenuId() {
            const stored = window.localStorage.getItem("activeMenuId");
            if (stored && MENU_ITEMS.some(i => i.id === stored)) return stored;
            return MENU_ITEMS[0]?.id ?? null;
        }

        let activeMenuId = getInitialActiveMenuId();

        function parseDelta(deltaStr) {
            const raw = String(deltaStr ?? "").trim();
            const cleaned = raw.replace("%", "").replace("+", "").trim();
            const num = Number(cleaned);
            const hasValidNumber = Number.isFinite(num);

            return {
                raw,
                num,
                isNegative: hasValidNumber ? num < 0 : raw.startsWith("-"),
            };
        }

        function renderSection1Cards(cards) {
            const container = document.getElementById("section1Cards");
            if (!container) return;

            container.innerHTML = cards.map(card => {
                const valueText = String(card.value ?? "").trim() || "Not Set";
                const { raw: deltaRaw, isNegative } = parseDelta(card.delta);
                const deltaClass = isNegative ? "text-red-500" : "text-[#48BB78]";

                return `
                    <div class="flex justify-between flex-row gap-5 bg-white px-[18px] py-[17px] rounded-xl shadow-sm items-center">
                        <div class="flex flex-col leading-tight">
                            <div class="text-gray-400 text-[12px] font-bold">${card.title ?? ""}</div>
                            <div class="font-bold text-[18px] text-gray-700">
                                ${valueText}
                                <span class="${deltaClass} font-bold text-[14px]">${deltaRaw}</span>
                            </div>
                        </div>
                        <div class="icon-box w-[45px] h-[45px] flex items-center justify-center bg-[#4FD1C5] rounded-xl">
                            ${card.iconSvg ?? ""}
                        </div>
                    </div>
                `;
            }).join("");
        }

        function renderSection2(items) {
            const container = document.getElementById("section2");
            if (!container) return;

            const arrowSvg = `
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            `;

            container.innerHTML = items.map(item => {
                if (item.type === "splitCard") {
                    return `
                        <div class="${item.colSpanClass} flex flex-col sm:flex-row bg-white rounded-xl shadow-sm w-full h-full">
                            <div class="flex flex-col justify-between w-full pl-[18px] pt-[17px] pb-[17px]">
                                <div>
                                    <div class="text-gray-400 font-bold text-[12px]">${item.kicker ?? ""}</div>
                                    <div class="font-bold text-[18px] text-gray-700">${item.title ?? ""}</div>
                                    <p class="text-[14px] text-gray-400 font-normal max-w-xs">${item.body ?? ""}</p>
                                </div>
                                <div class="font-bold text-[10px] mt-2 text-gray-700 inline-flex items-center gap-1">
                                    <span>${item.ctaLabel ?? "Read more"}</span>
                                    ${arrowSvg}
                                </div>
                            </div>
                            <div class="pr-[18px] pt-[17px] pb-[17px] pl-[18px]">
                                <div class="w-full flex justify-center items-center">
                                    <img class="w-full max-h-[300px] object-cover rounded-xl" src="${item.imageSrc ?? ""}"
                                        alt="${item.imageAlt ?? ""}">
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (item.type === "overlayCard") {
                    return `
                        <div class="${item.colSpanClass} flex bg-white rounded-xl shadow-sm w-full p-[18px] h-full">
                            <div class="relative flex flex-col justify-between bg-[url('${item.backgroundImage ?? ""}')] bg-cover bg-center rounded-xl w-full h-full overflow-hidden">
                                <div class="absolute inset-0 bg-[linear-gradient(90deg,rgba(21,25,40,0.65)_0%,rgba(21,25,40,0.45)_55%,rgba(21,25,40,0.25)_100%),linear-gradient(0deg,rgba(21,25,40,0.88)_0%,rgba(49,56,96,0.20)_55%,rgba(49,56,96,0)_100%)]"></div>
                                <div class="relative flex flex-col justify-between rounded-xl p-4 w-full h-full pl-[22px] pt-[20px] pb-[20px]">
                                    <div>
                                        <div class="font-bold text-[18px] text-white">${item.title ?? ""}</div>
                                        <p class="text-[14px] text-white max-w-xs font-normal">${item.body ?? ""}</p>
                                    </div>
                                    <div class="font-semibold text-[10px] text-white mt-2 inline-flex items-center gap-1">
                                        <span>${item.ctaLabel ?? "Read more"}</span>
                                        ${arrowSvg}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                return "";
            }).join("");
        }


        // section 3 working
        function renderTableHeaders(headers) {
            return headers.map((h, i) => `
    <th class="text-[10px] uppercase tracking-wider text-gray-400 text-left py-4 px-3 whitespace-nowrap">
      ${h}
    </th>
  `).join("");
        }

        function renderMembers(members) {
            return `
    <div class="flex -space-x-2 overflow-hidden">
      ${members.map(img => `
        <img class="h-5 w-5 rounded-full ring-2 ring-white" src="${img}">
      `).join("")}
    </div>
  `;
        }
        function renderProgress(value) {
            return `
    <div class="flex flex-col">
      <span class="text-[14px] text-teal-300 font-bold">${value}%</span>
      <div class="w-full max-w-[180px] h-[3px] bg-gray-200 rounded-full">
        <div class="h-[3px] bg-teal-300 rounded-full" style="width: ${value}%;">
        </div>
      </div>
    </div>
  `;
        }
        function renderTableRows(rows) {
            return rows.map(row => `
    <tr class="hover:bg-gray-50/60 transition-colors">
      
      <td class="py-4 pr-3 pl-0">
        <div class="flex items-center gap-2">
          <img src="${row.icon}" class="w-4 h-4">
          <span class="font-bold text-gray-700 text-[14px]">${row.name}</span>
        </div>
      </td>

      <td class="py-4 px-3">
        ${renderMembers(row.members)}
      </td>

      <td class="py-4 px-3 font-bold text-gray-700 text-[14px] whitespace-nowrap">
        ${row.budget}
      </td>

      <td class="py-4 pl-3 pr-0">
        ${renderProgress(row.completion)}
      </td>

    </tr>
  `).join("");
        }
        function renderProjectTable(item) {
            return `
    <div class="xl:${item.colSpanClass} bg-white rounded-xl shadow-sm">

      <!-- Header -->
      <div class="flex items-center justify-between p-4">
        <div>
          <div class="font-bold text-gray-700 text-[18px]">${item.header.title}</div>
          <div class="flex items-center">
            <img src="${item.header.icon}" class="w-[12px] h-[12px]">
            <span class="text-gray-400 text-[14px] ml-1">${item.header.subtitle}</span>
          </div>
        </div>

        <button>
          <img src="${item.header.menuIcon}">
        </button>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto pl-[22px] pr-[22px] pb-[31px] rounded-xl w-full">
        <table class="w-full min-w-[640px] sm:min-w-full table-auto border-collapse rounded-xl">
          <thead>
            <tr class="border-b border-gray-200">
              ${renderTableHeaders(item.table.headers)}
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-200">
            ${renderTableRows(item.table.rows)}
          </tbody>
        </table>
      </div>

    </div>
  `;
        }
        function renderImageCard(item) {
            return `
    <div class="${item.colSpanClass}">
      <img src="${item.image}" class="w-full h-auto">
    </div>
  `;
        }
        function renderSection3(items) {
            const container = document.getElementById("section3");

            container.innerHTML = items.map(item => {
                switch (item.type) {
                    case "projectTable":
                        return renderProjectTable(item);
                    case "imageCard":
                        return renderImageCard(item);
                    default:
                        return "";
                }
            }).join("");
        }
        function getActiveLabel() {
            return MENU_ITEMS.find(i => i.id === activeMenuId)?.label ?? "Dashboard";
        }

        function renderPageLabels() {
            const label = getActiveLabel();
            pageLabelNodes.forEach(node => {
                const kind = node.getAttribute("data-page-label");
                node.textContent = kind === "mobile" ? label.toUpperCase() : label;
            });
        }

        function renderMenu() {
            if (!menu) return;

            const itemClass = "menu-item flex items-center py-2 pl-3 rounded-2xl cursor-pointer";
            const iconBoxClass =
                "icon-box w-8 h-8 md:w-[30px] md:h-[30px] flex items-center justify-center shadow-sm rounded-full";
            const iconClass = "menu-icon w-4 h-4 md:w-[15px] md:h-[15px]";

            menu.innerHTML = MENU_ITEMS.map(item => {
                const isActive = item.id === activeMenuId;
                return `
                    <div class="${itemClass} ${isActive ? "bg-white shadow-sm" : ""}" data-menu-id="${item.id}">
                        <div class="${iconBoxClass} ${isActive ? "bg-[#4FD1C5]" : "bg-white"}">
                            ${item.svg.replace('class="menu-icon"', `class="${iconClass} ${isActive ? "text-white" : "text-[#4FD1C5]"}"`)}
                        </div>
                        <span class="text-sm ml-3 font-bold ${isActive ? "text-gray-700" : "text-gray-400"}">${item.label}</span>
                    </div>
                `;
            }).join("");
        }

        function renderAllMenus() {
            renderMenu();
            renderPageLabels();
        }

        function setActiveMenuId(nextId) {
            if (!nextId || !MENU_ITEMS.some(i => i.id === nextId)) return;
            activeMenuId = nextId;
            window.localStorage.setItem("activeMenuId", activeMenuId);
            renderAllMenus();
        }

        function handleMenuClick(event) {
            const item = event.target.closest("[data-menu-id]");
            if (!item) return;
            const id = item.getAttribute("data-menu-id");
            setActiveMenuId(id);

            if (isMobile()) {
                closeMenu();
            }
        }

        renderAllMenus();
        renderSection1Cards(SECTION1_CARDS);
        renderSection2(SECTION2_ITEMS);
        renderSection3(SECTION3_ITEMS);

        if (menu) menu.addEventListener("click", handleMenuClick);

        window.addEventListener("resize", () => {
            if (!isMobile()) {
                overlay?.classList.add("hidden");
                sidebar?.classList.remove("-translate-x-full");
            } else {
                sidebar?.classList.add("-translate-x-full");
            }
        });
    </script>
</body>

</html>
